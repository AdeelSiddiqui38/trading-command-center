# Trading Command Center hub on TrueNAS SCALE (Apps > trading-hub > Edit, or Custom App > Install via YAML), app name: trading-hub
# Sarah Slot 03. Runs the paper bots 24/7 so the PC is no longer needed. PAPER ONLY: no broker, no orders, no real money.
#
# - Code: on every start the latest hub files are pulled from GitHub (brain-hub/) into the company folder.
# - Bots + portfolios/logs live in the company folder /mnt/storage/sarah/projects/Trading Command Center (S:).
#   Sarah reads those files read-only for the Paper Bots agent and its alerts.
# - Keys (Telegram API + session, Vibe-Trading .env) live ONLY in /mnt/storage/sarah/trading-secrets, which is not
#   shared over SMB and is mounted only here. Enter them at http://10.0.0.110:7777/secrets (write-only page).
# - Python packages are kept in /mnt/storage/sarah/trading-venv so restarts are quick.
# - Which bots run is set in "Trading Command Center\trading-hub\hub_config.json" (autostart).
services:
  trading-hub:
    image: python:3.12-slim
    environment:
      TZ: America/Edmonton
      BRAIN_NO_OPEN: "1"
      HUB_SECRETS_DIR: /secrets
      TELEGRAM_SECRETS_DIR: /secrets
      PATH: /venv/bin:/usr/local/bin:/usr/bin:/bin
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - "/mnt/storage/sarah/projects/Trading Command Center:/tcc"
      - /mnt/storage/sarah/trading-secrets:/secrets
      - /mnt/storage/sarah/trading-venv:/venv
    ports:
      - "7777:7777"
    command:
      - sh
      - -c
      - |
        chmod 700 /secrets
        mkdir -p /secrets/vibe-trading && ln -sfn /secrets/vibe-trading /root/.vibe-trading
        [ -x /venv/bin/python ] || /usr/local/bin/python -m venv /venv
        BASE="yfinance pandas tzdata telethon openai ccxt"
        if [ "$$(cat /venv/.req-base 2>/dev/null)" != "$$BASE" ]; then pip install -q $$BASE && echo "$$BASE" > /venv/.req-base; fi
        # Vibe-Trading from PyPI (the GitHub snapshot's ccxt pin did not resolve); a failure here only affects the equity bot
        VIBE="vibe-trading-ai==0.1.15"
        if [ "$$(cat /venv/.req-vibe 2>/dev/null)" != "$$VIBE" ]; then pip install -q $$VIBE && echo "$$VIBE" > /venv/.req-vibe || echo "Vibe-Trading install failed (equity bot only)"; fi
        cd /tcc/trading-hub
        for f in hub.py prices.py gappers.py yahoo_scan.py trader_news.py; do
          python -c "import sys,urllib.request; d=urllib.request.urlopen('https://raw.githubusercontent.com/AdeelSiddiqui38/trading-command-center/main/brain-hub/'+sys.argv[1], timeout=30).read(); open(sys.argv[1]+'.new','wb').write(d)" $$f && mv -f $$f.new $$f || echo "kept local $$f"
        done
        exec python hub.py --no-open
    restart: always
